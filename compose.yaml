# UI -> Agent -> RAG. Only the UI is published to the host.
# The existing .env supplies the API key to Agent and RAG only.
x-rag-build: &rag-build
  context: .
  dockerfile: docker/Dockerfile.rag

services:
  ui:
    build: { context: ., dockerfile: docker/Dockerfile.ui }
    image: team67-ui
    environment:
      AGENT_URL: http://agent:8001
      UI_PORT: "7860"
      UI_TIMEOUT_S: ${UI_TIMEOUT_S:-300}
      GRADIO_ANALYTICS_ENABLED: "False"
    ports:
      - "127.0.0.1:${SCAFFOLD_UI_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:7860/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent:
    build: { context: ., dockerfile: docker/Dockerfile.agent }
    image: team67-agent
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      web_hook: ${web_hook:-}
      AGENT_PORT: "8001"
      RAG_URL: http://rag:8002
      RAG_TIMEOUT_S: ${RAG_TIMEOUT_S:-90}
      AGENT_LOG_DIR: /logs/agent_runs
    volumes:
      - ./logs:/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rag:
    build: *rag-build
    image: team67-rag
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAG_PORT: "8002"
      RAG_DATA_DIR: /data
      RAG_MIN_RERANK_SCORE: ${RAG_MIN_RERANK_SCORE:--5.0}
      HF_HOME: /models/huggingface
    volumes:
      - ./data:/data  # retrieval writes only new query embeddings to its cache
      - rag-models:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Historical fixture generator, never started with the real application.
  prepare:
    build: *rag-build
    image: team67-rag
    profiles: ["tools"]
    command: ["python", "/srv/scripts/scaffold_prepare.py"]
    environment:
      RAG_DATA_DIR: /data/scaffold-demo
    volumes:
      - ./data/scaffold-demo:/data/scaffold-demo

volumes:
  rag-models:
